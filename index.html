<title>Путь скважины</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Rubik:wght@400;500;600;700&family=Russo+One&display=swap">
<style>
/* Layout: sticky header (mode · XP · timer) → scrollable 15-node stage strip → one centered work panel (lesson | task | reward). Geological cross-section is the visual motif. */
:root{
  --bg:#E8EDEE; --surface:#FFFFFF; --surface-2:#F2F5F5; --ink:#132029; --muted:#55666F; --line:#C7D2D6;
  --accent:#DF560E; --accent-ink:#FFFFFF; --office:#2D5AA3; --office-ink:#FFFFFF;
  --ok:#21835A; --bad:#BF3328; --warn:#B98103;
  --sky:#D6E5EB; --earth1:#D9C49C; --earth2:#C6AD7E; --shale:#959A86; --sand:#E5C171; --rock:#A9B3B6;
  --mud:#8C5B3A; --cement:#A2ABB0; --cement-h:#6E787E; --steel:#4E5D66; --grass:#5C9A4B; --oil:#262A25; --gas:#E9B634;
  --water:#5EA5D0; --buffer:#B9CB5A; --bp:#E3EDF4; --bp-line:#A9C2D3;
  --f-display:"Russo One","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1418; --surface:#142128; --surface-2:#1A2A32; --ink:#E1E9EC; --muted:#92A5AD; --line:#2A3C46;
  --accent:#FF7B34; --accent-ink:#1B0E06; --office:#80A3E9; --office-ink:#0C1418;
  --ok:#4CC089; --bad:#FF6B5D; --warn:#F0B73B;
  --sky:#18303B; --earth1:#5C4C33; --earth2:#4C3F2B; --shale:#4E5347; --sand:#8E7140; --rock:#56626A;
  --mud:#A26D48; --cement:#7F898F; --cement-h:#B7C1C6; --steel:#9DAEB7; --grass:#4E8A41; --oil:#050605; --gas:#E9B634;
  --water:#3E86B3; --buffer:#93A842; --bp:#0F222D; --bp-line:#2C4E63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1418; --surface:#142128; --surface-2:#1A2A32; --ink:#E1E9EC; --muted:#92A5AD; --line:#2A3C46;
  --accent:#FF7B34; --accent-ink:#1B0E06; --office:#80A3E9; --office-ink:#0C1418;
  --ok:#4CC089; --bad:#FF6B5D; --warn:#F0B73B;
  --sky:#18303B; --earth1:#5C4C33; --earth2:#4C3F2B; --shale:#4E5347; --sand:#8E7140; --rock:#56626A;
  --mud:#A26D48; --cement:#7F898F; --cement-h:#B7C1C6; --steel:#9DAEB7; --grass:#4E8A41; --oil:#050605; --gas:#E9B634;
  --water:#3E86B3; --buffer:#93A842; --bp:#0F222D; --bp-line:#2C4E63; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--office);outline-offset:2px;border-radius:6px}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 12px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1.1 var(--f-body);padding:12px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:transparent}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{font:400 18px/1 var(--f-display);letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{color:var(--accent)}
.modes{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.modes button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font:500 13px/1 var(--f-body);cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.xp{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--f-mono)}
.xp-bar{width:110px;height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.xp-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s ease}
.timer{display:flex;align-items:center;gap:6px;font:500 13px/1 var(--f-mono);color:var(--muted)}
.timer .ic{width:16px;height:16px}

/* stage map */
.map{padding-block:14px 4px}
.map-scroll{overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.map-track{display:flex;gap:18px;width:max-content;margin-inline:auto}
.mgroup{display:flex;flex-direction:column;gap:6px}
.mlabel{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--office)}
.mgroup.rig .mlabel{color:var(--accent)}
.mnodes{display:flex;gap:6px;position:relative}
.mnodes::before{content:"";position:absolute;left:16px;right:16px;top:50%;height:2px;background:var(--line);z-index:0}
.node{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font:600 13px/1 var(--f-mono);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.node .ic{width:16px;height:16px}
.node.done{background:var(--office);border-color:var(--office);color:var(--office-ink)}
.mgroup.rig .node.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.node.cur{border-color:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.node.locked{color:var(--muted);cursor:not-allowed;background:var(--surface-2)}

/* stage */
main{padding-block:14px 48px}
.stage-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
.stage-head h1{font:400 clamp(24px,4.4vw,34px)/1.1 var(--f-display);margin-top:6px}
.eyebrow.office{color:var(--office)} .eyebrow.rig{color:var(--accent)}
.rail{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:6px;font:500 13px/1 var(--f-body)}
.rail li{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--surface)}
.rail li.on{border-color:var(--ink);color:var(--ink)}
.rail li.past{color:var(--ok);border-color:var(--ok)}
.rail .sep{border:0;padding:0;background:none;color:var(--muted)}
.rail .ic{width:15px;height:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,26px)}

/* lesson */
.lesson{display:grid;gap:20px}
@media (min-width:780px){.lesson{grid-template-columns:1.3fr 1fr;align-items:stretch}}
.scene{border-radius:10px;overflow:hidden;background:var(--surface-2);min-width:0;align-self:start}
.scene svg,.sim-svg svg{display:block;width:100%;height:auto}
.lcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.lcard{flex:1;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:12px;background:var(--surface-2);min-height:220px}
.lcard-top{display:flex;align-items:center;justify-content:space-between}
.lic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--surface);color:var(--accent);border:1.5px solid var(--line)}
.lic .ic{width:28px;height:28px}
.lcard.office .lic{color:var(--office)}
.lcard h2{font:600 22px/1.2 var(--f-body)}
.lcard p{font-size:17px;line-height:1.5;max-width:42ch}
.lcard.pro{background:var(--surface);border:1.5px dashed var(--office)}
.pro-pill{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-mono);letter-spacing:.08em;padding:5px 8px;border-radius:999px;background:var(--office);color:var(--office-ink)}
.pro-pill .ic{width:12px;height:12px}
.lcount{font:500 13px/1 var(--f-mono);color:var(--muted)}
.lnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink);width:22px;border-radius:4px}
.skip{align-self:flex-start;font-size:14px}
.fade-in{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}

/* task */
.task-top{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin-bottom:18px}
.remember{flex:1 1 320px;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:15px;min-width:0}
.remember .ic{color:var(--warn);margin-top:1px}
.remember b{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.remember .rp{margin-top:6px;color:var(--office);font-family:var(--f-mono);font-size:14px}
.task-tools{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:8px}
.errs{font:500 13px/1 var(--f-mono);color:var(--muted)}
.errs.has{color:var(--bad)}
.q{font:600 19px/1.35 var(--f-body);margin-bottom:14px;max-width:60ch}
.opts{display:grid;gap:10px}
@media (min-width:660px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font:16px/1.4 var(--f-body);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt-k{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:600 13px/1 var(--f-mono);background:var(--surface-2);border:1px solid var(--line)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.ok .opt-k{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface));opacity:.75}
.opt.bad .opt-k{background:var(--bad);color:var(--surface);border-color:var(--bad)}

.seq{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.slot{display:flex;gap:12px;align-items:center;min-height:46px;padding:8px 12px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted)}
.slot-n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 12px/1 var(--f-mono);border:1.5px solid var(--line)}
.slot.filled{border-style:solid;border-color:var(--ok);color:var(--ink);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.slot.filled .slot-n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.slot.next{border-color:var(--ink)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font:15px/1.3 var(--f-body);cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.bad{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.chip[aria-pressed="true"].bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.chip.missing{border-style:dashed;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip.okc{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.multi{display:grid;gap:8px}
@media (min-width:660px){.multi{grid-template-columns:1fr 1fr}}
.multi .chip{display:flex;gap:10px;align-items:center}
.box{flex:none;width:20px;height:20px;border-radius:5px;border:1.5px solid currentColor;display:grid;place-items:center}
.box .ic{width:14px;height:14px;stroke-width:3;opacity:0}
.chip[aria-pressed="true"] .box .ic{opacity:1}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.simgrid{display:grid;gap:18px}
@media (min-width:780px){.simgrid{grid-template-columns:1.35fr 1fr}}
.sim-svg{background:var(--surface-2);border-radius:10px;overflow:hidden;min-width:0;align-self:start}
.sim-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.steps{display:grid;gap:8px}
.step{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font:15px/1.3 var(--f-body);cursor:pointer}
.step:hover:not(:disabled){border-color:var(--ink)}
.step .slot-n{color:var(--muted)}
.step.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface));cursor:default}
.step.done .slot-n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.fb{min-height:0}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:15px;line-height:1.45;margin-top:12px}
.note .ic{width:20px;height:20px;margin-top:1px}
.note.hint{background:color-mix(in srgb,var(--warn) 14%,var(--surface))} .note.hint .ic{color:var(--warn)}
.note.bad{background:color-mix(in srgb,var(--bad) 11%,var(--surface))} .note.bad .ic{color:var(--bad)}
.note.info{background:var(--surface-2)} .note.info .ic{color:var(--office)}
.note.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface))} .note.ok .ic{color:var(--ok)}
.sim-side .note{margin-top:0}
.win{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:20px;padding:16px;border-radius:12px;background:color-mix(in srgb,var(--ok) 11%,var(--surface));border:1.5px solid var(--ok)}
.win>.ic{color:var(--ok);width:28px;height:28px}
.win div{flex:1 1 240px;min-width:0}
.win b{font-size:17px}

/* drill */
.readout{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.ro-l{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.ro-v{font:400 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ro-s{font:500 13px/1 var(--f-mono);color:var(--muted)}
.meter-h{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
.meter-h b{font:600 14px/1 var(--f-mono);color:var(--ink)}
.gauge{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:var(--ok)}
.gauge.warn i{background:var(--warn)} .gauge.bad i{background:var(--bad)}
.drill-btns{display:grid;gap:8px}
.btn.big{padding:18px;font-size:17px;touch-action:none;user-select:none;-webkit-user-select:none}
.btn.big.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* pressure */
.ivs{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.ivs li{font:500 12px/1 var(--f-mono);padding:7px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.ivs li.on{border-color:var(--ink);color:var(--ink)}
.ivs li.ok{border-color:var(--ok);color:var(--ok)}
.pvals{font:500 14px/1.6 var(--f-mono);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.lbl{font-size:14px;color:var(--muted)}
.rho-row{display:flex;flex-direction:column;gap:6px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
output{font:400 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
output small{font:500 13px var(--f-mono);color:var(--muted)}
.zone{position:relative;height:30px;border-radius:8px;overflow:hidden;display:flex;font:600 11px/30px var(--f-mono);text-align:center}
.zone span{overflow:hidden;white-space:nowrap}
.zone .z1{background:color-mix(in srgb,var(--bad) 30%,var(--surface));color:var(--ink)}
.zone .z2{background:color-mix(in srgb,var(--ok) 35%,var(--surface));color:var(--ink)}
.zone .z3{background:color-mix(in srgb,var(--warn) 35%,var(--surface));color:var(--ink)}
.zone .mk{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);transform:translateX(-50%)}

/* logs */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}
.iv{cursor:pointer;outline:none}
.iv .iv-r{fill:var(--accent);fill-opacity:0;transition:fill-opacity .15s}
.iv:hover .iv-r{fill-opacity:.1}
.iv:focus-visible .iv-r{fill-opacity:.12;stroke:var(--office);stroke-width:3}
.iv.bad .iv-r{fill:var(--bad);fill-opacity:.16}
.iv.ok .iv-r{fill:var(--ok);fill-opacity:.2}

/* reward */
.reward{display:grid;justify-items:center;text-align:center;gap:12px;padding-block:20px}
.reward .gain{font:400 clamp(48px,9vw,72px)/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px}
.stars .ic{width:30px;height:30px;color:var(--line)}
.stars .ic.on{color:var(--gas);fill:var(--gas)}
.reward p{color:var(--muted);max-width:46ch}
.reward .btn{margin-top:8px}

/* start */
.start{display:grid;gap:28px;padding-block:28px 40px}
.start-hero{display:grid;gap:24px;align-items:center}
@media (min-width:820px){.start-hero{grid-template-columns:1fr 1.15fr}}
.start h1{font:400 clamp(40px,7vw,68px)/1 var(--f-display);letter-spacing:-.01em}
.start h1 span{color:var(--accent)}
.lede{font-size:18px;color:var(--muted);max-width:46ch;margin-top:14px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.facts span{font:500 13px/1 var(--f-mono);padding:8px 10px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface)}
.hero-svg{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.hero-svg svg{display:block;width:100%;height:auto}
.modes-pick{display:grid;gap:14px}
@media (min-width:700px){.modes-pick{grid-template-columns:1fr 1fr}}
.mode-card{display:flex;flex-direction:column;gap:10px;text-align:left;padding:20px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,transform .15s}
.mode-card:hover{border-color:var(--ink);transform:translateY(-2px)}
.mode-card h2{font:400 26px/1 var(--f-display);display:flex;align-items:center;justify-content:space-between;gap:10px}
.mode-card p{color:var(--muted)}
.mode-card ul{margin:0;padding-left:18px;font-size:15px;display:grid;gap:2px}
.mode-card .go{margin-top:auto;padding-top:6px;display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--accent)}
.tag{font:600 12px/1 var(--f-mono);padding:6px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.mode-card.pro .tag{background:var(--office);color:var(--office-ink)}
.foot{font-size:13px;color:var(--muted);max-width:70ch}

/* final */
.final{display:grid;gap:22px}
.final h1{font:400 clamp(30px,5vw,46px)/1.05 var(--f-display)}
.fstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

const G=80, Y=d=>+(G+d*170/3000).toFixed(1);
const svg=(inner,label,vb='0 0 600 260')=>`<svg viewBox="${vb}" role="img" aria-label="${label}">${inner}</svg>`;
const STRATA=[[0,400,'e1','суглинки'],[400,900,'shale','глины'],[900,1500,'e2','песчаники'],[1500,2200,'rock','известняки'],[2200,2650,'shale','аргиллиты'],[2650,2850,'sand','коллектор'],[2850,3600,'rock','']];
function ground(labels){
  let s=`<rect class="f-sky" width="600" height="${G}"/>`;
  STRATA.forEach(([a,b,c,n])=>{const y1=Y(a),y2=Math.min(Y(b),260);s+=`<rect class="f-${c}" x="0" y="${y1}" width="600" height="${(y2-y1).toFixed(1)}"/>`;if(labels&&n)s+=`<text class="t-sm" x="592" y="${((y1+y2)/2+4).toFixed(1)}" text-anchor="end">${n}</text>`;});
  return s+`<rect class="f-ink" x="0" y="${G-1}" width="600" height="1.5" opacity=".45"/>`;
}
const ticks=()=>[1000,2000,3000].map(d=>`<rect class="f-ink" x="0" y="${Y(d)}" width="8" height="1.2"/><text class="t-sm" x="11" y="${Y(d)+4}">${d} м</text>`).join('');
const HOLES=[{to:50,hw:26},{to:600,hw:20},{to:2000,hw:14},{to:3000,hw:9}];
function well(o){
  const d=o.depth??3000;let s='',from=0;
  HOLES.forEach(hl=>{if(d>from){const to=Math.min(d,hl.to);s+=`<rect class="f-mud" x="${300-hl.hw}" y="${Y(from)}" width="${hl.hw*2}" height="${(Y(to)-Y(from)).toFixed(1)}"/>`;}from=hl.to;});
  for(let i=0;i<(o.cem||0);i++){const hl=HOLES[i],a=i?HOLES[i-1].to:0,y1=Y(a),hh=(Y(hl.to)-y1).toFixed(1),c=o.cemCls||'';s+=`<rect class="f-cem ${c}" x="${300-hl.hw}" y="${y1}" width="5" height="${hh}"/><rect class="f-cem ${c}" x="${300+hl.hw-5}" y="${y1}" width="5" height="${hh}"/>`;}
  for(let i=0;i<(o.cas||0);i++){const hl=HOLES[i],x=hl.hw-5,hh=(Y(hl.to)-G).toFixed(1);s+=`<g class="cas" style="--i:${i}"><rect class="f-steel" x="${300-x}" y="${G}" width="2.5" height="${hh}"/><rect class="f-steel" x="${300+x-2.5}" y="${G}" width="2.5" height="${hh}"/></g>`;}
  return s;
}

const string=bd=>{const y=Y(bd);return `<rect class="f-steel" x="298.5" y="10" width="3" height="${(y-10).toFixed(1)}"/><path class="f-acc" d="M293 ${y-5}H307L300 ${y+3}Z"/>`;};

  const map={gr:(v,t)=>t.x+Math.min(v,150)/150*t.w,res:(v,t)=>t.x+Math.max(0,Math.min(3,Math.log10(v/0.2)))/3*t.w,por:(v,t)=>t.x+Math.min(v,30)/30*t.w};
  let s=`<rect class="f-surf" width="600" height="300"/>`;
  tr.forEach((t,ti)=>{
    s+=`<rect class="f-surf2 s-line" x="${t.x}" y="${top}" width="${t.w}" height="${bot-top}"/>`+[1,2,3].map(q=>`<line class="s-line" x1="${t.x+t.w*q/4}" x2="${t.x+t.w*q/4}" y1="${top}" y2="${bot}"/>`).join('')+label(t.x+6,22,t.h,'t-sm');
    const raw=[];for(let y=top;y<=bot;y+=3){const i=Math.min(n-1,Math.floor((y-top)/ih));const b=LOGV[types[i]][t.k];const r=nz(y,ti+1);raw.push(t.k==='res'?b*Math.exp((r-.5)*.5):t.k==='gr'?b*(1+(r-.5)*.28):Math.max(.5,b+(r-.5)*3));}
    const sm=raw.map((v,i)=>{let a=0,c=0;for(let j=-2;j<=2;j++){const u=raw[i+j];if(u!==undefined){a+=t.k==='res'?Math.log(u):u;c++;}}return t.k==='res'?Math.exp(a/c):a/c;});
    s+=`<path class="c-${t.k} ${scene?'draw':''}" ${scene?'pathLength="1"':''} style="--i:${ti}" d="${sm.map((v,i)=>(i?'L':'M')+map[t.k](v,t).toFixed(1)+' '+(top+i*3)).join('')}"/>`;
  });
  types.forEach((ty,i)=>{const y=top+i*ih,a=depth0+i*80;
    s+=`<line class="s-line" x1="0" x2="600" y1="${y}" y2="${y}"/>`+label(6,y+14,fmtN(a),'t-sm t-mut');
    if(!scene) s+=`<g class="iv ${marks[i]||''}" data-i="${i}" tabindex="0" role="button" aria-label="Интервал ${LET[i]}, ${a}–${a+80} м"><rect class="iv-r" x="0" y="${y}" width="600" height="${ih}"/><text class="t-big" x="34" y="${y+ih/2+7}" text-anchor="middle">${LET[i]}</text></g>`;
    else if(ty==='hc') s+=`<rect class="s-acc" stroke-width="2" stroke-dasharray="5 4" x="62" y="${y+2}" width="534" height="${ih-4}" rx="4"/>`+label(34,y+ih/2+5,'УВ?','t-sm','middle');
  });
  s+=label(6,bot+0,'','t-sm');
  return svg(s,'Каротажная диаграмма','0 0 600 300');
}

function taskOrder(el,d,api){

function taskDrill(el,api){

  el.innerHTML=`<p class="q">Добури скважину до 3 000 м. Удерживай кнопку «Бурить», следи за износом и вовремя меняй долото.</p>

   <div><div class="meter-h"><span>Износ долота</span><b id="dw"></b></div><div class="gauge" id="dg"><i id="dwb"></i></div></div>
   <div class="meter-h"><span>Скорость проходки</span><b id="dr"></b></div>

   <div class="fb"></div></div></div>`;
  const fb=$('.fb',el),hb=$('#hold',el),sw=$('#swap',el),svgBox=$('#dsvg',el);
  const rock=d=>!pro?{n:'',r:1,w:1}:d<900?{n:'мягкие',r:1.3,w:.6}:d<2200?{n:'средние',r:1,w:1}:{n:'твёрдые',r:.55,w:1.7};
  function draw(){

    $('#dd',el).textContent=fmtN(Math.round(depth))+' м';
    $('#dw',el).textContent=Math.round(wear)+'%';$('#dwb',el).style.width=wear+'%';

    const dt=Math.min(.05,(t-last)/1000);last=t;rop=0;
    if(trip){trip.t+=dt;const q=trip.t/trip.dur;bit=q<.5?depth*(1-q*2):depth*Math.min(1,(q-.5)*2);
      if(q>=1){trip=null;bit=depth;wear=0;broken=false;warned=false;note(fb,'info','Новое долото на забое. Продолжай бурить.');}}
    else if(hold&&!broken&&depth<GOAL){const k=rock(depth);const v=RATE*k.r*(1-.5*wear/100);rop=v;depth=Math.min(GOAL,depth+v*dt);bit=depth;wear=Math.min(100,wear+v*dt/LIFE*100*k.w);
      if(wear>=100){broken=true;hold=false;api.err();note(fb,'bad','Долото разрушено — это авария. Поднимай инструмент и меняй долото. В следующий раз делай СПО при износе 75–90%.');}
      else if(wear>75&&!warned){warned=true;note(fb,'hint','Износ выше 75% — пора на СПО.');}
      if(depth>=GOAL){fin=true;hold=false;draw();api.solved('Забой 3 000 м. Скважина пробурена до проектной глубины.');return;}}
    draw();raf=requestAnimationFrame(tick);
  }
  const start=()=>{if(fin||trip)return;if(broken){note(fb,'bad','Долото разрушено. Сначала смени его.');return;}hold=true;};
  const stop=()=>{hold=false;};
  hb.addEventListener('pointerdown',e=>{e.preventDefault();try{hb.setPointerCapture(e.pointerId)}catch(_){}start();});
  hb.addEventListener('pointerup',stop);hb.addEventListener('pointercancel',stop);hb.addEventListener('lostpointercapture',stop);
  hb.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')){e.preventDefault();if(!e.repeat)start();}});
  hb.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stop();});
  hb.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('blur',stop);
  sw.onclick=()=>{if(trip||fin||hold)return;if(wear<25&&!broken){note(fb,'hint','Долото почти новое. Лишняя СПО — потеря времени.');return;}trip={t:0,dur:.8+depth/3000*1.6};hold=false;note(fb,'info','СПО: поднимаем инструмент, меняем долото, спускаем обратно…');};
  draw();raf=requestAnimationFrame(t=>{last=t;tick(t);});
  CLEAN.push(()=>{cancelAnimationFrame(raf);window.removeEventListener('blur',stop);});
}
function taskPressure(el,api){
  const pro=isPro();let k=0,rho=1.00,res=null,busy=false;
  el.innerHTML=`<p class="q">Подбери плотность раствора для каждого интервала: давление раствора должно быть выше пластового и ниже давления гидроразрыва.</p>
  <div class="simgrid"><div class="sim-svg" id="psvg"></div><div class="sim-side"><ol class="ivs" id="ivs"></ol><div class="pvals" id="pv"></div>
   <div class="rho-row"><label class="lbl" for="rho">Плотность бурового раствора</label><output id="rhov" for="rho"></output><input type="range" id="rho" min="1" max="2" step="0.01" value="1"></div>
   ${pro?'':'<div class="zone" id="zone" aria-hidden="true"></div>'}
   <button type="button" class="btn primary" id="pchk">Проверить</button><div class="fb"></div></div></div>`;
  const fb=$('.fb',el),inp=$('#rho',el);
  function ui(){
    const iv=PIV[k];
    $('#ivs',el).innerHTML=PIV.map((v,i)=>`<li class="${i<k?'ok':i===k?'on':''}">${fmtN(v.a)}–${fmtN(v.b)} м</li>`).join('');
    $('#pv',el).innerHTML=pro?`Глубина забоя: ${fmtN(iv.b)} м<br>Рпл = ${MPa(iv.p,iv.b)} МПа<br>Ргрп = ${MPa(iv.f,iv.b)} МПа`:`Пластовое давление ≈ ${fmt(iv.p)} г/см³<br>Давление гидроразрыва ≈ ${fmt(iv.f)} г/см³`;
    $('#rhov',el).innerHTML=`${fmt(rho)} <small>г/см³${pro?` → Ргидр = ${MPa(rho,iv.b)} МПа`:''}</small>`;
    if(!pro){const z=$('#zone',el),a=(iv.p-1)*100,b=(iv.f-iv.p)*100,c=100-a-b;z.innerHTML=`<span class="z1" style="width:${a}%">приток</span><span class="z2" style="width:${b}%">окно</span><span class="z3" style="width:${c}%">поглощение</span><i class="mk" style="left:${(rho-1)*100}%"></i>`;}
    $('#psvg',el).innerHTML=pressSVG(k,res);
  }
  inp.oninput=()=>{rho=+inp.value;res=null;ui();};
  $('#pchk',el).onclick=()=>{if(busy)return;const iv=PIV[k];
    if(rho<=iv.p){res='kick';api.err();note(fb,'bad','Газопроявление! Давление раствора ниже пластового — флюид идёт в скважину. Утяжели раствор.');}
    else if(rho>=iv.f){res='loss';api.err();note(fb,'bad','Поглощение! Раствор разрывает пласт и уходит в него. Облегчи раствор.');}
    else{res='ok';busy=true;note(fb,'ok',`Плотность ${fmt(rho)} г/см³ в окне. Интервал пробурён без осложнений.`);
      setTimeout(()=>{busy=false;if(k<PIV.length-1){k++;res=null;fb.innerHTML='';ui();}else{$('#pchk',el).disabled=true;inp.disabled=true;api.solved('Все три интервала пройдены в окне давлений.');}},RM?300:1300);}
    ui();};
  ui();
}
function taskLogs(el,api){
  const pro=isPro(),types=pro?LOGSETS.pro:LOGSETS.basic,marks={};let fin=false;
  el.innerHTML=`<p class="q">Найди интервал, перспективный на нефть или газ. Нажми на него на каротажной диаграмме.</p>
  <div class="sim-svg" id="lsvg"></div><div class="legend"><span><i style="background:var(--ok)"></i>GR — гамма-каротаж</span><span><i style="background:var(--bad)"></i>сопротивление (логарифмическая шкала)</span>${pro?'<span><i style="background:var(--office)"></i>пористость</span>':''}</div><div class="fb"></div>`;
  const box=$('#lsvg',el),fb=$('.fb',el);
  const draw=()=>{box.innerHTML=logsSVG(types,pro,marks,false);};
  const choose=i=>{if(fin||marks[i])return;const ty=types[i];
    if(ty==='hc'){marks[i]='ok';fin=true;draw();api.solved(`Интервал ${LET[i]}: ${LOGWHY.hc}`);}
    else{marks[i]='bad';draw();api.err();note(fb,'bad',`Интервал ${LET[i]}: ${LOGWHY[ty]}`);const g=$(`.iv[data-i="${i}"]`,box);if(g)g.focus();}};
  box.addEventListener('click',e=>{const g=e.target.closest('.iv');if(g)choose(+g.dataset.i);});
  box.addEventListener('keydown',e=>{const g=e.target.closest('.iv');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();choose(+g.dataset.i);}});
  draw();
}

  document.body.appendChild(c);setTimeout(()=>c.remove(),2600);}

function showFinal(){
  cleanup();S.t1=S.t1||Date.now();
  hdr.hidden=true;mapEl.hidden=true;
  const xp=S.xp.reduce((a,b)=>a+b,0),max=S.max.reduce((a,b)=>a+b,0)||1,acc=xp/max;
  let r=0;RANKS.forEach((k,i)=>{if(acc>=k.min)r=i;});

  <p class="foot">Режим: ${isPro()?'Профи (×1,5 XP)':'Базовый'}. Учебный тренажёр: корпоративные и правовые схемы упрощены, технические цифры учебные. Реальные работы ведутся по утверждённым проектам.</p></section>`;
  $('#again').onclick=()=>startGame(S.mode);$('#switch').onclick=()=>startGame(other);
